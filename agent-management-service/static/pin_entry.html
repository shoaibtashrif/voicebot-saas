<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant - Secure Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-container h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .login-container p {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        .pin-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .pin-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #bdc3c7;
            background: transparent;
            transition: all 0.2s ease;
        }

        .pin-dot.filled {
            background: #3498db;
            border-color: #3498db;
        }

        .pin-dot.error {
            border-color: #e74c3c;
            animation: shake 0.4s ease-in-out;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .keypad button {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 20px 0;
            font-size: 24px;
            font-weight: 600;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
        }

        .keypad button:active {
            background: #e9ecef;
            transform: scale(0.95);
        }

        .keypad .action-btn {
            background: transparent;
            border: none;
            color: #95a5a6;
            font-size: 16px;
        }

        .keypad .action-btn:active {
            color: #7f8c8d;
            transform: scale(0.95);
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            min-height: 20px;
            margin-bottom: 15px;
        }
        
        .loading-spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(52, 152, 219, 0.3);
            border-radius: 50%;
            border-top-color: #3498db;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Voice Assistant Access</h1>
        <p>Please enter your 4-digit PIN to continue</p>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="loading-spinner" id="loadingSpinner"></div>

        <div class="pin-display">
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
        </div>

        <div class="keypad">
            <button onclick="appendNum(1)">1</button>
            <button onclick="appendNum(2)">2</button>
            <button onclick="appendNum(3)">3</button>
            <button onclick="appendNum(4)">4</button>
            <button onclick="appendNum(5)">5</button>
            <button onclick="appendNum(6)">6</button>
            <button onclick="appendNum(7)">7</button>
            <button onclick="appendNum(8)">8</button>
            <button onclick="appendNum(9)">9</button>
            <button class="action-btn" onclick="clearPin()">Clear</button>
            <button onclick="appendNum(0)">0</button>
            <button class="action-btn" onclick="deleteNum()">⌫</button>
        </div>
    </div>

    <script>
        let currentPin = '';
        const companySlug = window.location.pathname.split('/').pop();
        const dots = document.querySelectorAll('.pin-dot');
        const errorMessage = document.getElementById('errorMessage');
        const spinner = document.getElementById('loadingSpinner');

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < currentPin.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
                dot.classList.remove('error');
            });
        }

        function appendNum(num) {
            if (currentPin.length < 4) {
                currentPin += num;
                errorMessage.textContent = '';
                updateDots();

                if (currentPin.length === 4) {
                    verifyPin();
                }
            }
        }

        function deleteNum() {
            if (currentPin.length > 0) {
                currentPin = currentPin.slice(0, -1);
                updateDots();
            }
        }

        function clearPin() {
            currentPin = '';
            updateDots();
            errorMessage.textContent = '';
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            dots.forEach(dot => dot.classList.add('error'));
            setTimeout(clearPin, 600);
        }

        async function verifyPin() {
            try {
                // Show loading
                spinner.style.display = 'block';
                
                const response = await fetch(`/auth/${companySlug}/verify-pin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: parseInt(currentPin) })
                });

                const data = await response.json();

                if (response.ok && data.session_token) {
                    // Redirect back to the agent page, but with the session token in the query params
                    spinner.style.display = 'none';
                    window.location.href = `/${companySlug}?session_token=${data.session_token}`;
                } else {
                    spinner.style.display = 'none';
                    showError(data.detail || 'Invalid PIN');
                }
            } catch (err) {
                spinner.style.display = 'none';
                showError('Network error. Please try again.');
            }
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (/^[0-9]$/.test(e.key)) {
                appendNum(e.key);
            } else if (e.key === 'Backspace') {
                deleteNum();
            } else if (e.key === 'Escape') {
                clearPin();
            }
        });
    </script>
</body>
</html>
